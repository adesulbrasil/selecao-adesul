<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seleção Adesul | Painel</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #181818;
    }

    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 28px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
      margin-bottom: 20px;
    }

    h1 { margin-top: 0; }
    h2 { margin-top: 0; }

    input {
      width: 100%;
      padding: 12px;
      margin: 6px 0 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 16px;
    }

    button {
      padding: 12px 20px;
      background: #111;
      color: white;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover { background: #333; }

    .sair {
      background: #777;
      float: right;
    }

    #erro {
      color: #b00020;
      margin-top: 12px;
    }

    #painel { display: none; }

    .tabela {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      text-align: left;
      padding: 10px;
      border-bottom: 1px solid #ddd;
      vertical-align: top;
    }

    th {
      background: #111;
      color: white;
    }

    tr:hover {
      background: #f7f7f7;
    }

    .contador {
      font-size: 18px;
      margin: 15px 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="login" class="card">
    <h1>Seleção Adesul</h1>
    <h2>Acesso interno</h2>

    <label>E-mail</label>
    <input type="email" id="email">

    <label>Senha</label>
    <input type="password" id="senha">

    <button onclick="entrar()">ENTRAR</button>

    <div id="erro"></div>
  </div>

  <div id="painel">

    <div class="card">
      <button class="sair" onclick="sair()">SAIR</button>

      <h1>Candidatos</h1>
      <div class="contador" id="contador"></div>

      <div class="tabela">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>Idade</th>
              <th>Bairro</th>
              <th>Cidade</th>
              <th>Telefone</th>
              <th>Experiência</th>
              <th>Áreas</th>
              <th>Interesse</th>
            </tr>
          </thead>

          <tbody id="lista"></tbody>
        </table>
      </div>
    </div>

  </div>

</div>

<script>
const SUPABASE_URL = "https://hetkropzbpsybgbavwfd.supabase.co";
const SUPABASE_KEY = "sb_publishable_rhrhtkOhmIX8DpF1QFvEEg_IdaTVtgu";

const supabaseClient = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function entrar() {

  const email = document.getElementById("email").value;
  const senha = document.getElementById("senha").value;
  const erro = document.getElementById("erro");

  erro.innerText = "";

  const { error } = await supabaseClient.auth.signInWithPassword({
    email: email,
    password: senha
  });

  if (error) {
    erro.innerText = "E-mail ou senha incorretos.";
    return;
  }

  mostrarPainel();
}

async function mostrarPainel() {

  document.getElementById("login").style.display = "none";
  document.getElementById("painel").style.display = "block";

  const { data, error } = await supabaseClient
    .from("candidatos")
    .select("*")
    .order("criado_em", { ascending: false });

  if (error) {
    alert("Erro ao carregar candidatos.");
    console.error(error);
    return;
  }

  document.getElementById("contador").innerText =
    data.length + " candidato(s) cadastrado(s)";

  const lista = document.getElementById("lista");
  lista.innerHTML = "";

  data.forEach(c => {

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${c.nome_completo ?? ""}</td>
      <td>${c.idade ?? ""}</td>
      <td>${c.bairro ?? ""}</td>
      <td>${c.cidade ?? ""}</td>
      <td>${c.telefone ?? ""}</td>
      <td>${c.tempo_experiencia ?? ""}</td>
      <td>${Array.isArray(c.areas_experiencia) ? c.areas_experiencia.join(", ") : (c.areas_experiencia ?? "")}</td>
      <td>${Array.isArray(c.interesses) ? c.interesses.join(", ") : (c.interesses ?? "")}</td>
    `;

    lista.appendChild(tr);
  });
}

async function sair() {
  await supabaseClient.auth.signOut();
  location.reload();
}

async function verificarLogin() {

  const { data } = await supabaseClient.auth.getSession();

  if (data.session) {
    mostrarPainel();
  }
}

verificarLogin();
</script>

</body>
</html>
