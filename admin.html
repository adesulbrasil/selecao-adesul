 <!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seleção Adesul | Painel RH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f3f4f6;
  color: #202020;
}

.topo {
  background: #111;
  color: white;
  padding: 22px 30px;
}

.topo h1 {
  margin: 0;
  font-size: 25px;
}

.topo p {
  margin: 5px 0 0;
  color: #bbb;
}

.container {
  max-width: 1250px;
  margin: 30px auto;
  padding: 0 20px;
}

.card {
  background: white;
  border-radius: 10px;
  padding: 25px;
  box-shadow: 0 2px 10px rgba(0,0,0,.08);
  margin-bottom: 20px;
}

/* LOGIN */

#login {
  max-width: 450px;
  margin: 70px auto;
}

input {
  width: 100%;
  padding: 12px;
  margin: 6px 0 15px;
  border: 1px solid #ccc;
  border-radius: 6px;
  font-size: 15px;
}

button {
  border: 0;
  border-radius: 6px;
  background: #111;
  color: white;
  padding: 11px 18px;
  cursor: pointer;
  font-size: 14px;
}

button:hover {
  background: #333;
}

#erro {
  color: #b00020;
  margin-top: 15px;
}

#painel {
  display: none;
}

/* CONTROLES */

.barra {
  display: grid;
  grid-template-columns: 2fr 1fr auto;
  gap: 12px;
  align-items: center;
}

.barra input,
.barra select {
  margin: 0;
  height: 44px;
}

select {
  padding: 10px;
  border: 1px solid #ccc;
  border-radius: 6px;
  background: white;
  font-size: 15px;
}

.resumo {
  display: flex;
  gap: 15px;
  margin: 20px 0;
}

.numero {
  background: white;
  border-radius: 8px;
  padding: 15px 20px;
  min-width: 170px;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
}

.numero strong {
  display: block;
  font-size: 27px;
}

/* CANDIDATOS */

#lista {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(310px,1fr));
  gap: 15px;
}

.candidato {
  background: white;
  border-radius: 9px;
  padding: 20px;
  border-left: 5px solid #111;
  box-shadow: 0 2px 8px rgba(0,0,0,.06);
  cursor: pointer;
}

.candidato:hover {
  transform: translateY(-2px);
  box-shadow: 0 4px 13px rgba(0,0,0,.12);
}

.candidato h3 {
  margin: 0 0 8px;
}

.candidato p {
  margin: 5px 0;
  color: #555;
}

.tags {
  margin-top: 12px;
}

.tag {
  display: inline-block;
  background: #eee;
  border-radius: 20px;
  padding: 5px 9px;
  margin: 3px 3px 0 0;
  font-size: 12px;
}

/* MODAL */

#modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.65);
  padding: 30px;
  overflow-y: auto;
}

.modal-box {
  background: white;
  max-width: 750px;
  margin: 20px auto;
  border-radius: 10px;
  padding: 30px;
}

.modal-box h2 {
  margin-top: 0;
}

.linha {
  padding: 9px 0;
  border-bottom: 1px solid #eee;
}

.fechar {
  float: right;
  background: #777;
}

.sair {
  background: #777;
}

@media(max-width:700px) {
  .barra {
    grid-template-columns: 1fr;
  }

  .resumo {
    display: block;
  }

  .numero {
    margin-bottom: 10px;
  }
}
</style>
</head>

<body>

<div class="topo">
  <h1>ADESUL | Seleção de Pessoas</h1>
  <p>Painel interno de candidatos</p>
</div>


<!-- LOGIN -->

<div id="login" class="card">

  <h2>Acesso interno</h2>

  <label>E-mail</label>
  <input
    id="email"
    type="email"
    placeholder="seuemail@adesul.com"
  >

  <label>Senha</label>
  <input
    id="senha"
    type="password"
    placeholder="Senha"
  >

  <button onclick="entrar()">ENTRAR</button>

  <div id="erro"></div>

</div>


<!-- PAINEL -->

<div id="painel" class="container">

  <div class="card">

    <button class="sair" onclick="sair()" style="float:right">
      SAIR
    </button>

    <h2>Banco de candidatos</h2>

    <div class="barra">

      <input
        id="busca"
        type="text"
        placeholder="Buscar por nome, bairro ou cidade..."
        oninput="filtrar()"
      >

      <select id="filtroArea" onchange="filtrar()">
        <option value="">Todas as experiências</option>
        <option>Marcenaria</option>
        <option>Serralheria</option>
        <option>Pintura</option>
        <option>Montagem</option>
        <option>Acabamento gráfico</option>
        <option>Adesivagem</option>
        <option>Funilaria</option>
        <option>Tapeçaria</option>
        <option>Elétrica</option>
        <option>Obras</option>
      </select>

      <button onclick="carregarCandidatos()">
        ATUALIZAR
      </button>

    </div>

  </div>


  <div class="resumo">

    <div class="numero">
      <strong id="total">0</strong>
      candidatos
    </div>

    <div class="numero">
      <strong id="exibidos">0</strong>
      exibidos
    </div>

  </div>


  <div id="lista"></div>

</div>


<!-- FICHA COMPLETA -->

<div id="modal">

  <div class="modal-box">

    <button class="fechar" onclick="fecharFicha()">
      FECHAR
    </button>

    <h2 id="fichaNome">Candidato</h2>

    <div id="ficha"></div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://hetkropzbpsybgbavwfd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rhrhtkOhmIX8DpF1QFvEEg_IdaTVtgu";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let candidatos = [];


/* LOGIN */

async function entrar() {

  const email =
    document.getElementById("email").value.trim();

  const senha =
    document.getElementById("senha").value;

  const erro =
    document.getElementById("erro");

  erro.innerText = "Entrando...";

  const { error } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password: senha
    });

  if(error) {

    console.error(error);

    erro.innerText =
      "Não foi possível entrar. Verifique o e-mail e a senha.";

    return;
  }

  erro.innerText = "";

  abrirPainel();
}


/* ABRIR PAINEL */

async function abrirPainel() {

  document.getElementById("login").style.display =
    "none";

  document.getElementById("painel").style.display =
    "block";

  await carregarCandidatos();
}


/* CARREGAR BANCO */

async function carregarCandidatos() {

  const { data, error } =
    await supabaseClient
      .from("candidatos")
      .select("*")
      .order("criado_em", {
        ascending:false
      });

  if(error) {

    console.error(error);

    alert(
      "Não foi possível carregar os candidatos."
    );

    return;
  }

  candidatos = data || [];

  document.getElementById("total").innerText =
    candidatos.length;

  filtrar();
}


/* FILTROS */

function filtrar() {

  const busca =
    document.getElementById("busca")
      .value
      .toLowerCase();

  const area =
    document.getElementById("filtroArea")
      .value
      .toLowerCase();

  const filtrados =
    candidatos.filter(c => {

      const texto =
        JSON.stringify(c).toLowerCase();

      const bateBusca =
        !busca ||
        texto.includes(busca);

      const experiencias =
        Array.isArray(c.areas_experiencia)
          ? c.areas_experiencia.join(" ")
          : (c.areas_experiencia || "");

      const bateArea =
        !area ||
        experiencias
          .toLowerCase()
          .includes(area);

      return bateBusca && bateArea;

    });

  document.getElementById("exibidos").innerText =
    filtrados.length;

  desenhar(filtrados);
}


/* DESENHAR CARDS */

function desenhar(lista) {

  const div =
    document.getElementById("lista");

  div.innerHTML = "";

  if(lista.length === 0) {

    div.innerHTML =
      "<div class='card'>Nenhum candidato encontrado.</div>";

    return;
  }

  lista.forEach(c => {

    const card =
      document.createElement("div");

    card.className = "candidato";

    const experiencias =
      Array.isArray(c.areas_experiencia)
        ? c.areas_experiencia
        : [];

    let tags = "";

    experiencias.forEach(a => {
      tags +=
        `<span class="tag">${esc(a)}</span>`;
    });

    card.innerHTML = `
      <h3>${esc(c.nome_completo || "Sem nome")}</h3>

      <p>
        <strong>Idade:</strong>
        ${esc(c.idade ?? "-")}
      </p>

      <p>
        <strong>Local:</strong>
        ${esc(c.bairro || "-")}
        ${c.cidade ? " - " + esc(c.cidade) : ""}
      </p>

      <p>
        <strong>Experiência:</strong>
        ${esc(c.tempo_experiencia || "-")}
      </p>

      <div class="tags">
        ${tags}
      </div>
    `;

    card.onclick =
      () => abrirFicha(c);

    div.appendChild(card);

  });
}


/* FICHA */

function abrirFicha(c) {

  document.getElementById("fichaNome")
    .innerText =
      c.nome_completo || "Candidato";

  const ficha =
    document.getElementById("ficha");

  ficha.innerHTML = "";

  const nomes = {

    idade:"Idade",

    bairro:"Bairro",

    cidade:"Cidade",

    telefone:"WhatsApp / Telefone",

    tempo_experiencia:
      "Tempo de experiência",

    areas_experiencia:
      "Conhecimentos / Experiências",

    interesses:
      "Áreas de interesse",

    hora_extra:
      "Disponibilidade para hora extra",

    viagem:
      "Disponibilidade para viagens",

    observacoes:
      "Observações",

    criado_em:
      "Cadastro realizado em"

  };

  Object.keys(c).forEach(campo => {

    if(
      campo === "id" ||
      campo === "nome_completo"
    ) return;

    let valor = c[campo];

    if(valor === null ||
       valor === undefined ||
       valor === "") return;

    if(Array.isArray(valor))
      valor = valor.join(", ");

    if(typeof valor === "boolean")
      valor = valor ? "Sim" : "Não";

    const linha =
      document.createElement("div");

    linha.className = "linha";

    linha.innerHTML =
      `<strong>${esc(nomes[campo] || campo)}:</strong>
       ${esc(valor)}`;

    ficha.appendChild(linha);

  });

  document.getElementById("modal")
    .style.display = "block";
}


function fecharFicha() {

  document.getElementById("modal")
    .style.display = "none";

}


/* LOGOUT */

async function sair() {

  await supabaseClient.auth.signOut();

  location.reload();

}


/* SEGURANÇA DE TEXTO */

function esc(valor) {

  return String(valor ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* VERIFICAR SESSÃO */

async function verificarLogin() {

  const { data } =
    await supabaseClient.auth.getSession();

  if(data.session)
    abrirPainel();

}

verificarLogin();

</script>

</body>
</html>
