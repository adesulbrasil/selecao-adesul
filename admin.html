<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seleção Adesul | Painel RH</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f3f4f6;
  color:#202020;
}

.topo{
  background:#111;
  color:white;
  padding:22px 30px;
}

.topo h1{
  margin:0;
  font-size:25px;
}

.topo p{
  margin:5px 0 0;
  color:#bbb;
}

.container{
  max-width:1400px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:white;
  border-radius:10px;
  padding:25px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px;
}

/* LOGIN */

#login{
  max-width:450px;
  margin:70px auto;
}

input,
textarea,
select{
  width:100%;
  padding:11px;
  border:1px solid #ccc;
  border-radius:6px;
  background:white;
  font-size:15px;
  font-family:Arial,Helvetica,sans-serif;
}

input,
textarea{
  margin:6px 0 15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

button{
  border:0;
  border-radius:6px;
  background:#111;
  color:white;
  padding:11px 18px;
  cursor:pointer;
  font-size:14px;
}

button:hover{
  background:#333;
}

button:disabled{
  opacity:.6;
  cursor:wait;
}

#erro{
  color:#b00020;
  margin-top:15px;
}

#painel{
  display:none;
}

/* FILTROS */

.barra{
  display:grid;
  grid-template-columns:2fr 1fr 1fr 1fr auto;
  gap:10px;
  align-items:center;
}

.barra input,
.barra select{
  margin:0;
  height:44px;
}

.resumo{
  display:flex;
  gap:15px;
  margin:20px 0;
  flex-wrap:wrap;
}

.numero{
  background:white;
  border-radius:8px;
  padding:15px 20px;
  min-width:170px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.numero strong{
  display:block;
  font-size:27px;
}

/* CARDS */

#lista{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:15px;
}

.candidato{
  background:white;
  border-radius:9px;
  padding:20px;
  border-left:5px solid #111;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  cursor:pointer;
  transition:.15s;
}

.candidato:hover{
  transform:translateY(-2px);
  box-shadow:0 4px 13px rgba(0,0,0,.12);
}

.candidato h3{
  margin:0 0 10px;
}

.candidato p{
  margin:5px 0;
  color:#555;
}

.tags{
  margin-top:10px;
}

.tag{
  display:inline-block;
  background:#eee;
  border-radius:20px;
  padding:5px 9px;
  margin:3px 3px 0 0;
  font-size:12px;
}

.linha-badges{
  margin-top:14px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  display:inline-block;
  padding:6px 9px;
  border-radius:5px;
  font-size:12px;
  font-weight:bold;
}

.status-novo{background:#e5e7eb}
.status-triagem{background:#dbeafe}
.status-entrevistar{background:#fef3c7}
.status-teste{background:#ede9fe}
.status-aprovado{background:#dcfce7}
.status-contratado{background:#bbf7d0}
.status-banco{background:#e0f2fe}
.status-descartado{background:#fee2e2}

.classe-prioridade{background:#dcfce7}
.classe-auxiliar{background:#dbeafe}
.classe-analisar{background:#fef3c7}
.classe-nao{background:#fee2e2}
.classe-neutra{background:#eee}

/* MODAL */

#modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.65);
  padding:30px;
  overflow-y:auto;
  z-index:999;
}

.modal-box{
  background:white;
  max-width:950px;
  margin:20px auto;
  border-radius:10px;
  padding:30px;
}

.modal-box h2{
  margin-top:0;
}

.fechar{
  float:right;
  background:#777;
}

.sair{
  background:#777;
}

/* TRIAGEM */

.triagem{
  margin:20px 0;
  padding:20px;
  border-radius:10px;
  background:#f5f5f5;
  border:1px solid #ddd;
}

.triagem h3{
  margin:0 0 15px;
}

.grid-indicadores{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.indicador{
  background:white;
  border-radius:8px;
  padding:15px;
  border:1px solid #e4e4e4;
}

.indicador small{
  display:block;
  color:#666;
  margin-bottom:6px;
}

.indicador strong{
  font-size:20px;
}

.alertas{
  margin-top:15px;
}

.alerta{
  display:inline-block;
  margin:4px 4px 0 0;
  padding:7px 10px;
  border-radius:5px;
  background:#fee2e2;
  color:#991b1b;
  font-size:13px;
  font-weight:bold;
}

.sem-alerta{
  color:#166534;
  font-size:14px;
  font-weight:bold;
}

/* TÉCNICO */

.secao{
  margin-top:25px;
}

.secao h3{
  margin-bottom:10px;
}

.tabela-tecnica{
  width:100%;
  border-collapse:collapse;
}

.tabela-tecnica td{
  border-bottom:1px solid #eee;
  padding:8px 5px;
}

.tabela-tecnica td:last-child{
  text-align:right;
  font-weight:bold;
}

.nivel-forte{
  color:#15803d;
}

.nivel-medio{
  color:#92400e;
}

.nivel-baixo{
  color:#666;
}

/* FICHA */

.linha{
  padding:9px 0;
  border-bottom:1px solid #eee;
}

.linha strong{
  display:inline-block;
  min-width:210px;
}

/* GESTÃO */

.bloco-rh{
  background:#f5f5f5;
  border-radius:10px;
  padding:22px;
  margin-top:25px;
  border:1px solid #ddd;
}

.bloco-rh h3{
  margin-top:0;
}

.grid-rh{
  display:grid;
  grid-template-columns:1fr;
  gap:15px;
}

.campo-rh label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.salvar{
  background:#15803d;
  margin-top:5px;
}

.salvar:hover{
  background:#166534;
}

#mensagemSalvar{
  margin-left:12px;
  font-weight:bold;
}

@media(max-width:850px){

  .barra{
    grid-template-columns:1fr;
  }

  .grid-indicadores{
    grid-template-columns:1fr 1fr;
  }

}

@media(max-width:600px){

  .grid-indicadores{
    grid-template-columns:1fr;
  }

  #modal{
    padding:10px;
  }

  .modal-box{
    padding:20px;
  }

  .linha strong{
    display:block;
    min-width:0;
    margin-bottom:4px;
  }

}

</style>
</head>

<body>

<div class="topo">

  <h1>ADESUL | Seleção de Pessoas</h1>

  <p>Painel interno de candidatos</p>

</div>


<!-- LOGIN -->

<div id="login" class="card">

  <h2>Acesso interno</h2>

  <label>E-mail</label>

  <input
    id="email"
    type="email"
    placeholder="seuemail@adesul.com"
  >

  <label>Senha</label>

  <input
    id="senha"
    type="password"
    placeholder="Senha"
  >

  <button onclick="entrar()">
    ENTRAR
  </button>

  <div id="erro"></div>

</div>


<!-- PAINEL -->

<div id="painel" class="container">

  <div class="card">

    <button
      class="sair"
      onclick="sair()"
      style="float:right"
    >
      SAIR
    </button>

    <h2>Banco de candidatos</h2>

    <div class="barra">

      <input
        id="busca"
        type="text"
        placeholder="Buscar nome, bairro, cidade..."
        oninput="filtrar()"
      >

      <select
        id="filtroArea"
        onchange="filtrar()"
      >
        <option value="">Todas as experiências</option>
        <option>Marcenaria</option>
        <option>Serralheria</option>
        <option>Comunicação visual</option>
        <option>Montagem</option>
        <option>Pintura</option>
        <option>Funilaria</option>
        <option>Elétrica</option>
        <option>Acabamento gráfico</option>
        <option>Adesivagem</option>
        <option>Tapeçaria</option>
        <option>Construção civil</option>
      </select>

      <select
        id="filtroClassificacao"
        onchange="filtrar()"
      >
        <option value="">Todas as classificações</option>
        <option value="prioridade">Prioridade</option>
        <option value="auxiliar">Auxiliar / Potencial</option>
        <option value="analisar">Analisar</option>
        <option value="nao aderente">Não aderente</option>
      </select>

      <select
        id="filtroStatus"
        onchange="filtrar()"
      >
        <option value="">Todos os status</option>
        <option value="novo">Novo</option>
        <option value="triagem">Triagem</option>
        <option value="entrevistar">Entrevistar</option>
        <option value="teste_pratico">Teste prático</option>
        <option value="aprovado">Aprovado</option>
        <option value="contratado">Contratado</option>
        <option value="banco_talentos">Banco de talentos</option>
        <option value="descartado">Descartado</option>
      </select>

      <button onclick="carregarCandidatos()">
        ATUALIZAR
      </button>

    </div>

  </div>


  <div class="resumo">

    <div class="numero">

      <strong id="total">0</strong>

      candidatos

    </div>

    <div class="numero">

      <strong id="exibidos">0</strong>

      exibidos

    </div>

  </div>


  <div id="lista"></div>

</div>


<!-- MODAL -->

<div id="modal">

  <div class="modal-box">

    <button
      class="fechar"
      onclick="fecharFicha()"
    >
      FECHAR
    </button>

    <h2 id="fichaNome">
      Candidato
    </h2>


    <!-- RESULTADO AUTOMÁTICO -->

    <div class="triagem">

      <h3>Triagem automática</h3>

      <div class="grid-indicadores">

        <div class="indicador">

          <small>Pontuação técnica</small>

          <strong id="resultadoTecnico">
            -
          </strong>

        </div>

        <div class="indicador">

          <small>Comportamental</small>

          <strong id="resultadoComportamental">
            -
          </strong>

        </div>

        <div class="indicador">

          <small>Afinidade profissional</small>

          <strong id="resultadoAfinidade">
            -
          </strong>

        </div>

        <div class="indicador">

          <small>Classificação</small>

          <strong id="resultadoClassificacao">
            -
          </strong>

        </div>

      </div>


      <div
        id="resultadoAlertas"
        class="alertas"
      ></div>

    </div>


    <!-- MAPA TÉCNICO -->

    <div class="secao">

      <h3>Mapa técnico</h3>

      <div id="mapaTecnico"></div>

    </div>


    <!-- CADASTRO -->

    <div class="secao">

      <h3>Ficha do candidato</h3>

      <div id="ficha"></div>

    </div>


    <!-- GESTÃO INTERNA -->

    <div class="bloco-rh">

      <h3>Gestão da seleção</h3>

      <div class="grid-rh">

        <div class="campo-rh">

          <label>Status</label>

          <select id="rhStatus">

            <option value="novo">
              Novo
            </option>

            <option value="triagem">
              Triagem
            </option>

            <option value="entrevistar">
              Entrevistar
            </option>

            <option value="teste_pratico">
              Teste prático
            </option>

            <option value="aprovado">
              Aprovado
            </option>

            <option value="contratado">
              Contratado
            </option>

            <option value="banco_talentos">
              Banco de talentos
            </option>

            <option value="descartado">
              Descartado
            </option>

          </select>

        </div>


        <div class="campo-rh">

          <label>Observações internas</label>

          <textarea
            id="rhObservacoes"
            placeholder="Entrevista, pretensão salarial, disponibilidade, impressão do entrevistador, teste prático..."
          ></textarea>

        </div>

      </div>


      <button
        id="botaoSalvar"
        class="salvar"
        onclick="salvarAvaliacao()"
      >
        SALVAR
      </button>

      <span id="mensagemSalvar"></span>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
"https://hetkropzbpsybgbavwfd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_rhrhtkOhmIX8DpFlQFvEEg_IdaTVtgu";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let candidatos = [];

let candidatoAberto = null;


/* MAPA DAS 14 HABILIDADES */

const habilidades = [

  ["nivel_marcenaria",
   "Marcenaria"],

  ["nivel_serralheria",
   "Serralheria"],

  ["nivel_comunicacao_visual",
   "Comunicação visual"],

  ["nivel_montagem_eventos",
   "Montagem de eventos"],

  ["nivel_montagem_moveis",
   "Montagem de móveis"],

  ["nivel_instalacao_externa",
   "Instalação externa"],

  ["nivel_pintura",
   "Pintura"],

  ["nivel_funilaria",
   "Funilaria"],

  ["nivel_eletrica",
   "Elétrica"],

  ["nivel_acabamento_grafico",
   "Acabamento gráfico"],

  ["nivel_adesivagem",
   "Adesivagem"],

  ["nivel_tensionamento",
   "Tensionamento"],

  ["nivel_tapecaria_revestimentos",
   "Tapeçaria / revestimentos"],

  ["nivel_construcao_civil",
   "Construção civil"]

];


const nomesNivel = {

  0:"Nunca fiz",

  1:"Já ajudei",

  2:"Executo com orientação",

  3:"Faço sozinho",

  4:"Domino"

};


/* LOGIN */

async function entrar() {

  const email =
    document
      .getElementById("email")
      .value
      .trim();


  const senha =
    document
      .getElementById("senha")
      .value;


  const erro =
    document
      .getElementById("erro");


  erro.innerText =
    "Entrando...";


  const { error } =
    await supabaseClient
      .auth
      .signInWithPassword({

        email:email,

        password:senha

      });


  if(error) {

    console.error(error);

    erro.innerText =
      "Não foi possível entrar. Verifique e-mail e senha.";

    return;

  }


  erro.innerText = "";

  abrirPainel();

}


/* PAINEL */

async function abrirPainel() {

  document
    .getElementById("login")
    .style.display =
      "none";


  document
    .getElementById("painel")
    .style.display =
      "block";


  await carregarCandidatos();

}


/* CARREGAR */

async function carregarCandidatos() {

  const { data, error } =
    await supabaseClient

      .from("candidatos")

      .select("*")

      .order(
        "criado_em",
        {
          ascending:false
        }
      );


  if(error) {

    console.error(error);

    alert(
      "Não foi possível carregar os candidatos."
    );

    return;

  }


  candidatos =
    data || [];


  document
    .getElementById("total")
    .innerText =
      candidatos.length;


  filtrar();

}


/* NORMALIZAÇÃO */

function normalizar(valor) {

  return String(
    valor || ""
  )

    .normalize("NFD")

    .replace(
      /[\u0300-\u036f]/g,
      ""
    )

    .toLowerCase()

    .trim();

}


/* FILTROS */

function filtrar() {

  const busca =
    normalizar(
      document
        .getElementById("busca")
        .value
    );


  const area =
    normalizar(
      document
        .getElementById("filtroArea")
        .value
    );


  const classificacao =
    normalizar(
      document
        .getElementById("filtroClassificacao")
        .value
    );


  const status =
    document
      .getElementById("filtroStatus")
      .value;


  const filtrados =
    candidatos.filter(c => {


      const texto =
        normalizar(
          JSON.stringify(c)
        );


      const bateBusca =
        !busca ||
        texto.includes(busca);


      const bateArea =
        !area ||
        texto.includes(area);


      const classe =
        normalizar(
          c.classificacao
        );


      let bateClasse =
        true;


      if(classificacao) {

        if(
          classificacao ===
          "auxiliar"
        ) {

          bateClasse =
            classe.includes(
              "auxiliar"
            );

        }

        else {

          bateClasse =
            classe.includes(
              classificacao
            );

        }

      }


      const statusAtual =
        c.status || "novo";


      const bateStatus =
        !status ||
        statusAtual === status;


      return (

        bateBusca &&

        bateArea &&

        bateClasse &&

        bateStatus

      );

    });


  document
    .getElementById("exibidos")
    .innerText =
      filtrados.length;


  desenhar(filtrados);

}


/* PONTUAÇÃO TÉCNICA */

/*
Se o banco já tiver pontuação,
usa o valor armazenado.

Para candidatos antigos que tenham
níveis técnicos preenchidos e nota
ainda zero, o painel também consegue
recalcular a técnica pelas 3 melhores:

melhor x3
segunda x2
terceira x1

máximo = 24.
*/

function calcularTecnica(c) {

  const niveis =
    habilidades
      .map(([campo]) => {

        const valor =
          Number(c[campo]);

        return Number.isFinite(valor)
          ? valor
          : 0;

      })

      .sort(
        (a,b) => b-a
      );


  const calculada =
    (niveis[0] || 0) * 3 +

    (niveis[1] || 0) * 2 +

    (niveis[2] || 0);


  const armazenada =
    Number(
      c.pontuacao_tecnica
    );


  if(
    Number.isFinite(armazenada) &&
    armazenada > 0
  ) {

    return armazenada;

  }


  return calculada;

}


/* STATUS */

function nomeStatus(status) {

  const nomes = {

    novo:"Novo",

    triagem:"Triagem",

    entrevistar:"Entrevistar",

    teste_pratico:"Teste prático",

    aprovado:"Aprovado",

    contratado:"Contratado",

    banco_talentos:
      "Banco de talentos",

    descartado:
      "Descartado"

  };


  return nomes[status] ||
    "Novo";

}


function classeStatus(status) {

  const classes = {

    novo:
      "status-novo",

    triagem:
      "status-triagem",

    entrevistar:
      "status-entrevistar",

    teste_pratico:
      "status-teste",

    aprovado:
      "status-aprovado",

    contratado:
      "status-contratado",

    banco_talentos:
      "status-banco",

    descartado:
      "status-descartado"

  };


  return classes[status] ||
    "status-novo";

}


/* CLASSIFICAÇÃO */

function classeClassificacao(valor) {

  const t =
    normalizar(valor);


  if(
    t.includes("prioridade")
  ) {

    return "classe-prioridade";

  }


  if(
    t.includes("auxiliar") ||
    t.includes("potencial")
  ) {

    return "classe-auxiliar";

  }


  if(
    t.includes("analisar")
  ) {

    return "classe-analisar";

  }


  if(
    t.includes("nao aderente")
  ) {

    return "classe-nao";

  }


  return "classe-neutra";

}


function nomeClassificacao(valor) {

  if(
    valor === null ||
    valor === undefined ||
    String(valor).trim() === ""
  ) {

    return "Não classificado";

  }


  return String(valor);

}


/* DESENHAR CARDS */

function desenhar(lista) {

  const div =
    document
      .getElementById("lista");


  div.innerHTML = "";


  if(lista.length === 0) {

    div.innerHTML =
      "<div class='card'>Nenhum candidato encontrado.</div>";

    return;

  }


  lista.forEach(c => {


    const card =
      document
        .createElement("div");


    card.className =
      "candidato";


    const tecnico =
      calcularTecnica(c);


    const comportamento =
      Number(
        c.pontuacao_comportamental
      );


    const statusAtual =
      c.status || "novo";


    const classificacao =
      nomeClassificacao(
        c.classificacao
      );


    const areas =
      Array.isArray(
        c.areas_experiencia
      )

        ? c.areas_experiencia

        : [];


    let tags = "";


    areas.forEach(a => {

      tags +=
        `<span class="tag">
          ${esc(a)}
        </span>`;

    });


    card.innerHTML = `

      <h3>
        ${esc(
          c.nome_completo ||
          "Sem nome"
        )}
      </h3>

      <p>
        <strong>Idade:</strong>
        ${esc(
          c.idade ?? "-"
        )}
      </p>

      <p>
        <strong>Local:</strong>
        ${esc(
          c.bairro || "-"
        )}
        ${
          c.cidade
            ? " - " +
              esc(c.cidade)
            : ""
        }
      </p>

      <p>
        <strong>Técnica:</strong>
        ${esc(tecnico)}/24

        &nbsp; · &nbsp;

        <strong>Comportamento:</strong>
        ${
          Number.isFinite(
            comportamento
          )

            ? esc(comportamento)

            : "-"
        }/12
      </p>

      <p>
        <strong>Afinidade:</strong>
        ${esc(
          c.afinidade_profissional ||
          "-"
        )}
      </p>

      <div class="tags">
        ${tags}
      </div>

      <div class="linha-badges">

        <span
          class="badge ${classeStatus(statusAtual)}"
        >
          ${esc(
            nomeStatus(statusAtual)
          )}
        </span>

        <span
          class="badge ${classeClassificacao(classificacao)}"
        >
          ${esc(classificacao)}
        </span>

      </div>

    `;


    card.onclick =
      () => abrirFicha(c);


    div.appendChild(card);

  });

}


/* MAPA TÉCNICO */

function desenharMapaTecnico(c) {

  const div =
    document
      .getElementById("mapaTecnico");


  let linhas = "";


  habilidades.forEach(
    ([campo,nome]) => {


      const nivel =
        Number(c[campo]);


      if(
        !Number.isFinite(nivel)
      ) {

        return;

      }


      let classe =
        "nivel-baixo";


      if(nivel >= 3) {

        classe =
          "nivel-forte";

      }

      else if(nivel === 2) {

        classe =
          "nivel-medio";

      }


      linhas += `

        <tr>

          <td>
            ${esc(nome)}
          </td>

          <td class="${classe}">
            ${esc(nivel)}
            -
            ${esc(
              nomesNivel[nivel] ||
              "-"
            )}
          </td>

        </tr>

      `;

    }
  );


  if(!linhas) {

    div.innerHTML =
      "<p>Níveis técnicos não preenchidos neste cadastro.</p>";

    return;

  }


  div.innerHTML = `

    <table class="tabela-tecnica">

      ${linhas}

    </table>

  `;

}


/* FICHA */

function abrirFicha(c) {

  candidatoAberto = c;


  document
    .getElementById("fichaNome")
    .innerText =
      c.nome_completo ||
      "Candidato";


  const tecnico =
    calcularTecnica(c);


  const comportamento =
    Number(
      c.pontuacao_comportamental
    );


  document
    .getElementById("resultadoTecnico")
    .innerText =
      tecnico + "/24";


  document
    .getElementById("resultadoComportamental")
    .innerText =
      (
        Number.isFinite(
          comportamento
        )

          ? comportamento

          : "-"
      ) + "/12";


  document
    .getElementById("resultadoAfinidade")
    .innerText =
      c.afinidade_profissional ||
      "Não calculada";


  document
    .getElementById("resultadoClassificacao")
    .innerText =
      nomeClassificacao(
        c.classificacao
      );


  /* ALERTAS */

  const alertas =
    document
      .getElementById("resultadoAlertas");


  let htmlAlertas = "";


  if(
    c.alerta_profissional_acima_vaga
  ) {

    htmlAlertas +=
      `<span class="alerta">
        Profissional possivelmente acima da vaga
      </span>`;

  }


  if(
    c.alerta_comportamental
  ) {

    htmlAlertas +=
      `<span class="alerta">
        Atenção comportamental
      </span>`;

  }


  if(
    c.alerta_restricao_operacional
  ) {

    htmlAlertas +=
      `<span class="alerta">
        Restrição operacional
      </span>`;

  }


  alertas.innerHTML =
    htmlAlertas ||

    `<span class="sem-alerta">
      Sem alertas automáticos
    </span>`;


  desenharMapaTecnico(c);


  /* DADOS DO CANDIDATO */

  const ficha =
    document
      .getElementById("ficha");


  ficha.innerHTML = "";


  const camposInternos =
    new Set([

      "id",

      "nome_completo",

      "pontuacao_tecnica",

      "pontuacao_comportamental",

      "afinidade_profissional",

      "classificacao",

      "alerta_profissional_acima_vaga",

      "alerta_comportamental",

      "alerta_restricao_operacional",

      "observacoes_sistema",

      "status",

      "validacoes_tecnicas",

      ...habilidades.map(
        ([campo]) => campo
      )

    ]);


  const nomes = {

    idade:
      "Idade",

    bairro:
      "Bairro",

    cidade:
      "Cidade",

    telefone:
      "WhatsApp / telefone",

    tempo_experiencia:
      "Tempo de experiência",

    areas_experiencia:
      "Experiências declaradas",

    areas_interesse:
      "Áreas de interesse",

    interesses:
      "Áreas de interesse",

    outro_interesse_profissional:
      "Outro interesse profissional",

    hora_extra:
      "Disponibilidade para hora extra",

    viagem:
      "Disponibilidade para viagens",

    observacoes:
      "Observações do candidato",

    autoriza_dados_selecao:
      "Autorização de dados",

    criado_em:
      "Cadastro realizado em"

  };


  Object
    .keys(c)
    .forEach(campo => {


      if(
        camposInternos.has(campo)
      ) {

        return;

      }


      let valor =
        c[campo];


      if(
        valor === null ||
        valor === undefined ||
        valor === ""
      ) {

        return;

      }


      if(
        Array.isArray(valor)
      ) {

        valor =
          valor.join(", ");

      }


      if(
        typeof valor === "boolean"
      ) {

        valor =
          valor
            ? "Sim"
            : "Não";

      }


      if(
        campo === "criado_em"
      ) {

        valor =
          formatarData(valor);

      }


      if(
        typeof valor === "object"
      ) {

        valor =
          JSON.stringify(valor);

      }


      const linha =
        document
          .createElement("div");


      linha.className =
        "linha";


      linha.innerHTML = `

        <strong>
          ${esc(
            nomes[campo] ||
            tituloCampo(campo)
          )}:
        </strong>

        ${esc(valor)}

      `;


      ficha.appendChild(linha);

    });


  /* GESTÃO INTERNA */

  document
    .getElementById("rhStatus")
    .value =
      c.status || "novo";


  document
    .getElementById("rhObservacoes")
    .value =
      c.observacoes_sistema ||
      "";


  document
    .getElementById("mensagemSalvar")
    .innerText =
      "";


  document
    .getElementById("modal")
    .style.display =
      "block";

}


/* SALVAR SOMENTE GESTÃO HUMANA */

async function salvarAvaliacao() {

  if(!candidatoAberto) {

    return;

  }


  const botao =
    document
      .getElementById("botaoSalvar");


  const mensagem =
    document
      .getElementById("mensagemSalvar");


  botao.disabled =
    true;


  botao.innerText =
    "SALVANDO...";


  mensagem.innerText =
    "";


  const alteracoes = {

    status:

      document
        .getElementById("rhStatus")
        .value,


    observacoes_sistema:

      document
        .getElementById("rhObservacoes")
        .value
        .trim() || null

  };


  const { data, error } =
    await supabaseClient

      .from("candidatos")

      .update(alteracoes)

      .eq(
        "id",
        candidatoAberto.id
      )

      .select()

      .single();


  botao.disabled =
    false;


  botao.innerText =
    "SALVAR";


  if(error) {

    console.error(error);


    mensagem.style.color =
      "#b00020";


    mensagem.innerText =
      "Erro ao salvar: " +
      error.message;


    return;

  }


  candidatoAberto =
    data;


  const indice =
    candidatos.findIndex(
      c => c.id === data.id
    );


  if(indice !== -1) {

    candidatos[indice] =
      data;

  }


  mensagem.style.color =
    "#15803d";


  mensagem.innerText =
    "Salvo com sucesso.";


  filtrar();

}


/* UTILIDADES */

function tituloCampo(campo) {

  return String(campo)

    .replaceAll("_"," ")

    .replace(
      /\b\w/g,
      letra =>
        letra.toUpperCase()
    );

}


function formatarData(valor) {

  const data =
    new Date(valor);


  if(
    Number.isNaN(
      data.getTime()
    )
  ) {

    return valor;

  }


  return data.toLocaleString(
    "pt-BR"
  );

}


function esc(valor) {

  return String(
    valor ?? ""
  )

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


/* FECHAR */

function fecharFicha() {

  document
    .getElementById("modal")
    .style.display =
      "none";


  candidatoAberto =
    null;

}


/* LOGOUT */

async function sair() {

  await supabaseClient
    .auth
    .signOut();


  location.reload();

}


/* SESSÃO */

async function verificarLogin() {

  const { data } =
    await supabaseClient
      .auth
      .getSession();


  if(data.session) {

    abrirPainel();

  }

}


verificarLogin();
